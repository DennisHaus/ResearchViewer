<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COPC Viewer</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    #ui {
      position: fixed;
      right: 10px;
      top: 10px;
      z-index: 10000;
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="status">Starting COPC viewer...</div>
  <div id="ui">
    <button id="resetBtn">Reset view</button>
  </div>
  <div id="viewer"></div>

  <script>
    const status = document.getElementById("status");
    const container = document.getElementById("viewer");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000000);
    camera.position.set(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const ambient = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambient);

    let pointCloud = null;
    let cloudCenter = new THREE.Vector3(0, 0, 0);
    let cloudRadius = 10;

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    document.getElementById("resetBtn").addEventListener("click", () => {
      camera.position.set(
        cloudCenter.x + cloudRadius * 1.2,
        cloudCenter.y + cloudRadius * 1.2,
        cloudCenter.z + cloudRadius * 1.2
      );
      controls.target.copy(cloudCenter);
      controls.update();
    });

    // TODO: replace this with your COPC loading implementation
    async function loadCOPC() {
      status.textContent = "COPC loader not yet connected.";

      // Example placeholder:
      // 1. fetch COPC
      // 2. parse points
      // 3. create BufferGeometry
      // 4. create THREE.Points
      // 5. add to scene
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
    loadCOPC();
  </script>
</body>
</html>

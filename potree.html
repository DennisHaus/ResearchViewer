<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potree Viewer</title>

  <link rel="stylesheet" href="./potree/build/potree/potree.css">
    <script src="./potree/libs/other/BinaryHeap.js"></script>
    <script src="./potree/libs/tween/Tween.js"></script>
  <script src="./libs/three.min.js"></script>
  <script src="./potree/libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="./potree/libs/proj4/proj4.js"></script>

  <script src="./potree/build/potree/potree.js"></script>
  

  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; }
    #viewer { position:absolute; inset:0; width:100%; height:100%; }
    #status { position:fixed; top:10px; left:10px; z-index:9999; background:rgba(0,0,0,0.8); color:white; padding:8px 12px; border-radius:6px; }
  </style>
</head>
<body>
  <div id="status">Starting...</div>
  <div id="viewer"></div>

  <script>
    const status = document.getElementById("status");
    const viewer = new Potree.Viewer(document.getElementById("viewer"));
    const VIEW_KEY = "potreeView_blatten";

    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(1000000);
    viewer.setBackground("gradient");

    status.textContent = "Loading point cloud...";

    Potree.loadPointCloud("./models/output/metadata.json", "Blatten", (e) => {
      const cloud = e.pointcloud;

      // try to make points visible
      cloud.material.size = 2.0;
      cloud.material.pointSizeType = Potree.PointSizeType.FIXED;
      cloud.material.shape = Potree.PointShape.SQUARE;

      viewer.scene.addPointCloud(cloud);
      status.textContent = "Loaded";

      // set a simple view without fitToScreen / TWEEN
      setTimeout(() => {
        try {
          const bb = cloud.boundingBox || cloud.pcoGeometry?.boundingBox;
          if (bb) {
            const c = bb.getCenter(new THREE.Vector3());
            const s = bb.getSize(new THREE.Vector3());
            const m = Math.max(s.x, s.y, s.z);
            viewer.scene.view.position.set(c.x + m * 0.5, c.y + m * 0.5, c.z + m * 0.3);
            viewer.scene.view.lookAt(c);
          }
        } catch (err) {
          console.error(err);
          status.textContent = "Loaded, but view setup failed";
        }
      }, 800);
    });
    
    function saveView() {
  localStorage.setItem(VIEW_KEY, JSON.stringify({
    position: viewer.scene.view.position.toArray(),
    target: viewer.scene.view.target.toArray()
  }));
}
  </script>
</body>
</html>
